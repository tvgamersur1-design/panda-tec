<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panta Tec — Recuperar contraseña</title>
  <link rel="icon" type="image/svg+xml" href="/img/logoparatiket.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    :root {
      --black: #0a0a0a; --black-2: #1a1a1a; --white: #ffffff;
      --gray-50: #f9fafb; --gray-200: #e5e7eb; --gray-400: #9ca3af;
      --gray-600: #4b5563; --danger: #dc2626; --success: #16A34A;
      --focus: rgba(10,10,10,0.15);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      min-height: 100vh; 
      display: flex;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .brand-panel {
      flex: 1; background: var(--black); display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 3rem 2.5rem;
      position: relative; overflow: hidden;
    }
    .brand-panel::before {
      content: ''; position: absolute; width: 500px; height: 500px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.05); top: -120px; left: -120px;
    }
    .brand-panel::after {
      content: ''; position: absolute; width: 350px; height: 350px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.05); bottom: -80px; right: -80px;
    }
    .brand-logo { width: 320px; height: auto; position: relative; z-index: 1; }
    .brand-divider { width: 40px; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; margin: 1.25rem auto; position: relative; z-index: 1; }
    .brand-tagline { font-size: 0.875rem; color: rgba(255,255,255,0.35); text-align: center; max-width: 260px; line-height: 1.6; position: relative; z-index: 1; }

    .form-panel {
      width: 480px; min-width: 420px; background: var(--white); display: flex;
      flex-direction: column; align-items: center; justify-content: center; padding: 3rem 2.5rem;
    }
    .form-inner { width: 100%; }
    .form-header { margin-bottom: 2rem; }
    .form-header h2 { font-size: 1.625rem; font-weight: 700; color: var(--black); letter-spacing: -0.02em; }
    .form-header p { font-size: 0.875rem; color: var(--gray-400); margin-top: 0.375rem; }
    .form-header p strong { color: var(--black); font-weight: 600; }

    .form-group { margin-bottom: 1.125rem; }
    .form-group label { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--gray-600); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .input-wrapper { position: relative; }
    .input-wrapper > i { position: absolute; left: 0.875rem; top: 50%; transform: translateY(-50%); color: var(--gray-400); font-size: 0.875rem; pointer-events: none; }
    .form-group input {
      width: 100%; padding: 0.75rem 0.875rem 0.75rem 2.5rem;
      border: 1.5px solid var(--gray-200); border-radius: 8px;
      font-family: inherit; font-size: 0.9375rem; color: var(--black);
      background: var(--gray-50); outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .form-group input:focus { border-color: var(--black); background: var(--white); box-shadow: 0 0 0 3px var(--focus); }
    .form-group input::placeholder { color: var(--gray-400); }

    .code-input {
      text-align: center; font-size: 1.75rem; font-weight: 700; letter-spacing: 0.4em;
      padding-left: 0.875rem !important;
    }

    .btn-main {
      width: 100%; padding: 0.8125rem; background: var(--black); color: var(--white);
      border: none; border-radius: 8px; font-family: inherit; font-size: 0.9375rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: background 0.15s, transform 0.1s; margin-top: 1.5rem; letter-spacing: 0.01em;
    }
    .btn-main:hover:not(:disabled) { background: var(--black-2); transform: translateY(-1px); }
    .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg { display: none; align-items: center; gap: 0.5rem; border-radius: 8px; padding: 0.625rem 0.875rem; font-size: 0.875rem; margin-top: 1rem; flex-direction: column; }
    .msg.error { background: #fef2f2; border: 1px solid #fecaca; color: var(--danger); }
    .msg.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: var(--success); }
    .msg.visible { display: flex; }
    .msg > div:first-child { display: flex; align-items: center; gap: 0.5rem; width: 100%; }

    .step { display: none; }
    .step.active { display: block; }

    .back-link { display: inline-flex; align-items: center; gap: 0.375rem; color: var(--gray-400); font-size: 0.8125rem; text-decoration: none; margin-top: 1.5rem; transition: color 0.15s; }
    .back-link:hover { color: var(--black); }

    .resend-link { background: none; border: none; color: var(--gray-400); font-size: 0.8125rem; cursor: pointer; text-decoration: underline; margin-top: 0.75rem; display: block; }
    .resend-link:hover { color: var(--black); }

    .form-footer { text-align: center; margin-top: 2.5rem; font-size: 0.8125rem; color: var(--gray-400); }

    .toggle-password {
      position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--gray-400);
      font-size: 1rem; padding: 0.25rem; display: flex; align-items: center; transition: color 0.15s;
    }
    .toggle-password:hover { color: var(--black); }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .brand-panel { padding: 2.5rem 1.5rem; flex: none; }
      .brand-logo { width: 220px; margin-bottom: 1.25rem; }
      .brand-tagline { display: none; }
      .form-panel { width: 100%; min-width: unset; padding: 2rem 1.5rem; }
    }
    .rec-header-icon { font-size:1.25rem; opacity:0.6; }
    .rec-hint { font-size:0.75rem; color:var(--gray-400); margin-top:0.375rem; }
  </style>
</head>
<body>
  <div class="brand-panel">
    <img src="img/panda-tec-black-1.svg" alt="Panta Tec" class="brand-logo" />
    <div class="brand-divider"></div>
    <p class="brand-tagline">Recupera el acceso a tu cuenta</p>
  </div>

  <div class="form-panel">
    <div class="form-inner">

      <!-- PASO 1: Ingresar correo -->
      <div class="step active" id="step1">
        <div class="form-header">
          <h2><i class="fas fa-envelope rec-header-icon"></i> Recuperar contraseña</h2>
          <p>Ingresa el correo asociado a tu cuenta</p>
        </div>
        <form id="formCorreo">
          <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope" aria-hidden="true"></i>
              <input type="email" id="correo" placeholder="tu@correo.com" required />
            </div>
          </div>
          <button type="submit" class="btn-main" id="btnEnviar">
            <i class="fas fa-paper-plane"></i> Enviar código
          </button>
          <div class="msg" id="msg1" role="alert">
            <div><i class="fas fa-info-circle"></i><span id="msgText1"></span></div>
          </div>
        </form>
        <a href="/index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al login</a>
      </div>

      <!-- PASO 2: Ingresar código -->
      <div class="step" id="step2">
        <div class="form-header">
          <h2><i class="fas fa-shield-halved rec-header-icon"></i> Verificar código</h2>
          <p>Ingresa el código de 6 dígitos enviado a <strong id="correoMostrado"></strong></p>
        </div>
        <form id="formCodigo">
          <div class="form-group">
            <label for="codigo">Código de verificación</label>
            <div class="input-wrapper">
              <input type="text" id="codigo" class="code-input" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required autocomplete="one-time-code" inputmode="numeric" />
            </div>
          </div>
          <button type="submit" class="btn-main" id="btnVerificar">
            <i class="fas fa-check-circle"></i> Verificar código
          </button>
          <button type="button" class="resend-link" id="btnReenviar">¿No recibiste el código? Reenviar</button>
          <div class="msg" id="msg2" role="alert">
            <div><i class="fas fa-info-circle"></i><span id="msgText2"></span></div>
          </div>
        </form>
        <a href="/index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al login</a>
      </div>

      <!-- PASO 3: Nueva contraseña -->
      <div class="step" id="step3">
        <div class="form-header">
          <h2><i class="fas fa-lock rec-header-icon"></i> Nueva contraseña</h2>
          <p>Crea tu nueva contraseña</p>
        </div>
        <form id="formClave">
          <div class="form-group">
            <label for="nuevaClave">Nueva contraseña</label>
            <div class="input-wrapper">
              <i class="fas fa-lock" aria-hidden="true"></i>
              <input type="password" id="nuevaClave" placeholder="Mínimo 8 caracteres" minlength="8" required />
              <button type="button" class="toggle-password" id="toggleNueva" aria-label="Mostrar contraseña">
                <i class="fas fa-eye" id="eyeNueva"></i>
              </button>
            </div>
            <p class="rec-hint">
              <i class="fas fa-info-circle"></i> Debe contener mayúsculas, minúsculas y números
            </p>
          </div>
          <div class="form-group">
            <label for="confirmarClave">Confirmar contraseña</label>
            <div class="input-wrapper">
              <i class="fas fa-lock" aria-hidden="true"></i>
              <input type="password" id="confirmarClave" placeholder="Repite la contraseña" minlength="8" required />
              <button type="button" class="toggle-password" id="toggleConfirmar" aria-label="Mostrar contraseña">
                <i class="fas fa-eye" id="eyeConfirmar"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-main" id="btnRestablecer">
            <i class="fas fa-key"></i> Restablecer contraseña
          </button>
          <div class="msg" id="msg3" role="alert">
            <div><i class="fas fa-info-circle"></i><span id="msgText3"></span></div>
          </div>
        </form>
      </div>

      <div class="form-footer">
        <p>© <span id="year"></span> Panta Tec</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from './js/api.js';

    document.getElementById('year').textContent = new Date().getFullYear();

    let _correo = '';
    let _codigo = '';

    // Helpers
    const showMsg = (id, text, type) => {
      const el = document.getElementById(id);
      el.className = `msg ${type} visible`;
      const span = el.querySelector('span');
      if (span) span.textContent = text;
    };
    const hideMsg = (id) => { 
      const el = document.getElementById(id);
      el.classList.remove('visible');
      // Limpiar botón de continuar si existe
      const btnContinuar = document.getElementById('btnContinuar');
      if (btnContinuar) btnContinuar.remove();
    };
    const goStep = (n) => {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById(`step${n}`).classList.add('active');
      // Actualizar correo mostrado en paso 2
      if (n === 2 && _correo) {
        document.getElementById('correoMostrado').textContent = _correo;
      }
    };
    const setLoading = (btn, loading) => {
      btn.disabled = loading;
      if (loading) btn.dataset.original = btn.innerHTML;
      btn.innerHTML = loading ? '<i class="fas fa-spinner fa-spin"></i> Procesando…' : (btn.dataset.original || btn.innerHTML);
    };

    // Toggle password visibility
    document.getElementById('toggleNueva').addEventListener('click', function() {
      const input = document.getElementById('nuevaClave');
      const icon = document.getElementById('eyeNueva');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
    });
    document.getElementById('toggleConfirmar').addEventListener('click', function() {
      const input = document.getElementById('confirmarClave');
      const icon = document.getElementById('eyeConfirmar');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
    });

    // PASO 1: Enviar código
    document.getElementById('formCorreo').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg('msg1');
      _correo = document.getElementById('correo').value.trim();
      if (!_correo) return;
      
      // Validar formato de correo
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(_correo)) {
        showMsg('msg1', 'Formato de correo inválido', 'error');
        return;
      }
      
      const btn = document.getElementById('btnEnviar');
      setLoading(btn, true);
      const res = await api.post('/auth/recuperar', { correo: _correo });
      setLoading(btn, false);
      
      if (res.ok && res.data.success) {
        // ✅ Correo existe y código enviado - avanzar automáticamente
        showMsg('msg1', res.data.mensaje || 'Código enviado. Revisa tu correo.', 'success');
        setTimeout(() => goStep(2), 1500);
      } else {
        // ❌ Error (correo no existe, cuenta inactiva, rate limit, etc.)
        showMsg('msg1', res.data?.error || 'Error al enviar código', 'error');
      }
    });

    // PASO 2: Verificar código
    // Auto-focus and only allow numbers
    document.getElementById('codigo').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    document.getElementById('formCodigo').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg('msg2');
      _codigo = document.getElementById('codigo').value.trim();
      if (_codigo.length !== 6) { showMsg('msg2', 'El código debe tener 6 dígitos', 'error'); return; }
      const btn = document.getElementById('btnVerificar');
      setLoading(btn, true);
      const res = await api.post('/auth/verificar-codigo', { correo: _correo, codigo: _codigo });
      setLoading(btn, false);
      if (res.ok && res.data.valido) {
        showMsg('msg2', 'Código verificado correctamente', 'success');
        setTimeout(() => goStep(3), 1000);
      } else {
        showMsg('msg2', res.data?.error || 'Código inválido', 'error');
      }
    });

    // Reenviar código
    document.getElementById('btnReenviar').addEventListener('click', async () => {
      hideMsg('msg2');
      const res = await api.post('/auth/recuperar', { correo: _correo });
      if (res.ok) {
        showMsg('msg2', 'Código reenviado. Revisa tu correo.', 'success');
        document.getElementById('codigo').value = '';
      } else {
        showMsg('msg2', res.data?.error || 'Error al reenviar', 'error');
      }
    });

    // PASO 3: Restablecer contraseña
    document.getElementById('formClave').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg('msg3');
      const nueva = document.getElementById('nuevaClave').value;
      const confirmar = document.getElementById('confirmarClave').value;
      
      // Validaciones del frontend
      if (nueva !== confirmar) { 
        showMsg('msg3', 'Las contraseñas no coinciden', 'error'); 
        return; 
      }
      if (nueva.length < 8) { 
        showMsg('msg3', 'La contraseña debe tener al menos 8 caracteres', 'error'); 
        return; 
      }
      
      // Validar complejidad
      const tieneMinuscula = /[a-z]/.test(nueva);
      const tieneMayuscula = /[A-Z]/.test(nueva);
      const tieneNumero = /[0-9]/.test(nueva);
      
      if (!tieneMinuscula || !tieneMayuscula || !tieneNumero) {
        showMsg('msg3', 'La contraseña debe contener mayúsculas, minúsculas y números', 'error');
        return;
      }
      
      const btn = document.getElementById('btnRestablecer');
      setLoading(btn, true);
      const res = await api.post('/auth/restablecer', { correo: _correo, codigo: _codigo, nueva_clave: nueva });
      setLoading(btn, false);
      if (res.ok) {
        showMsg('msg3', '¡Contraseña restablecida! Redirigiendo al login…', 'success');
        setTimeout(() => { window.location.href = '/index.html'; }, 3000);
      } else {
        showMsg('msg3', res.data?.error || 'Error al restablecer', 'error');
      }
    });
  </script>
</body>
</html>
