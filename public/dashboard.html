<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Evitar que el navegador cachee esta página -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Panta Tec — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    :root {
      --color-primary: #2563EB; --color-primary-dark: #1D4ED8; --color-primary-light: #DBEAFE;
      --color-success: #16A34A; --color-warning: #D97706; --color-danger: #DC2626; --color-info: #0891B2;
      --color-bg: #F8FAFC; --color-surface: #FFFFFF; --color-border: #E2E8F0;
      --color-text: #1E293B; --color-text-muted: #64748B;
      --sidebar-bg: #1E293B; --sidebar-text: #CBD5E1; --sidebar-active: #2563EB;
      --sidebar-width: 240px; --topbar-height: 64px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--color-bg); color: var(--color-text); min-height: 100vh; display: flex; }

    /* Sidebar */
    .sidebar { width: var(--sidebar-width); min-height: 100vh; background: var(--sidebar-bg); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100; transition: transform 0.25s ease; }
    .sidebar-logo { display: flex; align-items: center; gap: 0.75rem; padding: 1.25rem 1.25rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-logo-icon { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: var(--color-primary); border-radius: 8px; flex-shrink: 0; }
    .sidebar-logo-icon i { color: #fff; font-size: 1rem; }
    .sidebar-logo-text { font-size: 1.125rem; font-weight: 700; color: #fff; }
    .sidebar-nav { flex: 1; padding: 0.75rem 0; overflow-y: auto; }
    .nav-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(203,213,225,0.5); padding: 0.75rem 1.25rem 0.25rem; }
    .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 1.25rem; color: var(--sidebar-text); font-size: 0.875rem; font-weight: 500; background: none; border: none; width: 100%; text-align: left; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .nav-item i { width: 18px; text-align: center; font-size: 0.9rem; flex-shrink: 0; }
    .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .nav-item.active { background: var(--sidebar-active); color: #fff; }
    .sidebar-footer { padding: 0.75rem 0; border-top: 1px solid rgba(255,255,255,0.08); }
    .sidebar-user { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 1.25rem; color: var(--sidebar-text); font-size: 0.875rem; }
    .sidebar-user i { font-size: 1.25rem; color: rgba(203,213,225,0.6); }
    .sidebar-user-name { font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-user-role { font-size: 0.75rem; color: rgba(203,213,225,0.6); text-transform: capitalize; }
    .btn-logout { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 1.25rem; color: #FDA4AF; font-size: 0.875rem; font-weight: 500; background: none; border: none; width: 100%; text-align: left; cursor: pointer; transition: background 0.15s; }
    .btn-logout i { width: 18px; text-align: center; }
    .btn-logout:hover { background: rgba(220,38,38,0.15); color: #FCA5A5; }

    /* Main */
    .main-wrapper { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { height: var(--topbar-height); background: var(--color-surface); border-bottom: 1px solid var(--color-border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; position: sticky; top: 0; z-index: 50; }
    .topbar-left { display: flex; align-items: center; gap: 1rem; }
    .topbar-title { font-size: 1.25rem; font-weight: 700; }
    .btn-menu-toggle { display: none; align-items: center; justify-content: center; width: 36px; height: 36px; background: none; border: 1px solid var(--color-border); border-radius: 8px; cursor: pointer; color: var(--color-text-muted); font-size: 1rem; }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .topbar-date { display: flex; align-items: center; gap: 0.375rem; font-size: 0.875rem; color: var(--color-text-muted); }
    .topbar-user { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; font-weight: 500; }
    .topbar-user i { color: var(--color-text-muted); }
    .content-area { flex: 1; padding: 1.5rem; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }

    /* Toast */
    #toastContainer { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1.25rem; border-radius: 10px; font-size: 0.875rem; font-weight: 500; color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.15); animation: slideIn 0.25s ease; max-width: 360px; }
    .toast.success { background: var(--color-success); }
    .toast.error   { background: var(--color-danger); }
    .toast.warning { background: var(--color-warning); }
    .toast.info    { background: var(--color-info); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    @media (max-width: 1023px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.visible { display: block; }
      .main-wrapper { margin-left: 0; }
      .btn-menu-toggle { display: flex; }
    }
    @media (max-width: 639px) {
      .topbar-date { display: none; }
      .content-area { padding: 1rem; }
    }

    /* Ocultar todo hasta verificar autenticación */
    body.auth-pending { visibility: hidden; }
  </style>
</head>
<body class="auth-pending">
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menú principal">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon" aria-hidden="true"><i class="fas fa-mobile-alt"></i></div>
      <span class="sidebar-logo-text">Panta Tec</span>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-label">Principal</span>
      <button class="nav-item active" data-module="dashboard"><i class="fas fa-chart-line"></i><span>Dashboard</span></button>
      <button class="nav-item" data-module="ventas"><i class="fas fa-shopping-cart"></i><span>Nueva Venta</span></button>
      <span class="nav-label">Catálogo</span>
      <button class="nav-item" data-module="productos"><i class="fas fa-mobile-screen"></i><span>Productos</span></button>
      <button class="nav-item" data-module="categorias"><i class="fas fa-tags"></i><span>Categorías</span></button>
      <span class="nav-label">Clientes y Pedidos</span>
      <button class="nav-item" data-module="clientes"><i class="fas fa-users"></i><span>Clientes</span></button>
      <button class="nav-item" data-module="pedidos"><i class="fas fa-truck"></i><span>Pedidos</span></button>
      <span class="nav-label">Administración</span>
      <button class="nav-item" data-module="reportes"><i class="fas fa-chart-bar"></i><span>Reportes</span></button>
      <button class="nav-item" data-module="usuarios"><i class="fas fa-user-cog"></i><span>Usuarios</span></button>
      <button class="nav-item" data-module="configuracion"><i class="fas fa-cog"></i><span>Configuración</span></button>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <i class="fas fa-user-circle" aria-hidden="true"></i>
        <div>
          <div class="sidebar-user-name" id="sidebarUserName">Usuario</div>
          <div class="sidebar-user-role" id="sidebarUserRole">—</div>
        </div>
      </div>
      <button class="btn-logout" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span>Cerrar sesión</span></button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar" role="banner">
      <div class="topbar-left">
        <button class="btn-menu-toggle" id="btnMenuToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
        <h1 class="topbar-title" id="topbarTitle">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <div class="topbar-date"><i class="far fa-calendar" aria-hidden="true"></i><span id="topbarDate"></span></div>
        <div class="topbar-user"><i class="fas fa-user-circle" aria-hidden="true"></i><span id="topbarUserName">—</span></div>
      </div>
    </header>
    <main class="content-area" id="contentArea" role="main"></main>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" aria-live="polite" aria-atomic="false"></div>

  <script>
    // Redirección inmediata si no hay token (antes de renderizar nada)
    if (!localStorage.getItem('panta_token')) {
      window.location.replace('/index.html');
    }
  </script>
  <script type="module">
    import { isLoggedIn, getUser, logout } from './js/auth.js';
    import { api } from './js/api.js';

    // Verificar token localmente primero (rápido)
    if (!isLoggedIn()) { window.location.replace('/index.html'); }

    // Verificar token contra el servidor (evita acceso con token expirado o inválido)
    (async () => {
      const { ok } = await api.get('/auth/verificar');
      if (!ok) {
        localStorage.clear();
        window.location.replace('/index.html');
      } else {
        // Token válido, mostrar la página
        document.body.classList.remove('auth-pending');
      }
    })();

    const user = getUser();
    if (user) {
      const name = user.nombre_completo || user.usuario || 'Usuario';
      document.getElementById('sidebarUserName').textContent = name;
      document.getElementById('sidebarUserRole').textContent = user.rol || '';
      document.getElementById('topbarUserName').textContent = name;
    }

    // Fecha
    const now = new Date();
    document.getElementById('topbarDate').textContent =
      now.toLocaleDateString('es-PE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
         .replace(/^\w/, c => c.toUpperCase());

    // Logout
    document.getElementById('btnLogout').addEventListener('click', logout);

    // Sidebar mobile
    const sidebar  = document.getElementById('sidebar');
    const overlay  = document.getElementById('sidebarOverlay');
    const btnToggle = document.getElementById('btnMenuToggle');
    const openSidebar  = () => { sidebar.classList.add('open'); overlay.classList.add('visible'); btnToggle.setAttribute('aria-expanded','true'); };
    const closeSidebar = () => { sidebar.classList.remove('open'); overlay.classList.remove('visible'); btnToggle.setAttribute('aria-expanded','false'); };
    btnToggle.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
    overlay.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });

    // Toast global
    window.showToast = function(msg, type = 'info', duration = 4000) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'times-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}" aria-hidden="true"></i><span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, duration);
    };

    // Navegación
    const navItems = document.querySelectorAll('.nav-item[data-module]');
    const topbarTitle = document.getElementById('topbarTitle');
    const contentArea = document.getElementById('contentArea');
    const TITLES = { dashboard:'Dashboard', ventas:'Nueva Venta', productos:'Productos', categorias:'Categorías', clientes:'Clientes', pedidos:'Pedidos', reportes:'Reportes', usuarios:'Usuarios', configuracion:'Configuración' };

    async function loadModule(name) {
      navItems.forEach(i => { i.classList.toggle('active', i.dataset.module === name); });
      topbarTitle.textContent = TITLES[name] || name;
      closeSidebar();
      contentArea.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--color-text-muted);gap:0.75rem;"><i class="fas fa-spinner fa-spin" style="font-size:2rem;"></i><p>Cargando ${TITLES[name]}…</p></div>`;
      try {
        const mod = await import(`./js/modules/${name}.js`);
        if (mod.init) await mod.init(contentArea, user);
      } catch (e) {
        contentArea.innerHTML = `<div style="padding:2rem;color:var(--color-text-muted);text-align:center;"><i class="fas fa-tools" style="font-size:2rem;margin-bottom:0.75rem;display:block;"></i><p>Módulo <strong>${TITLES[name]}</strong> en construcción.</p></div>`;
      }
    }

    navItems.forEach(i => i.addEventListener('click', () => loadModule(i.dataset.module)));
    loadModule('dashboard');
  </script>
</body>
</html>
