<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panta Tec — Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="/img/logoparatiket.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    :root {
      --black:   #0a0a0a;
      --black-2: #1a1a1a;
      --white:   #ffffff;
      --gray-50: #f9fafb;
      --gray-200:#e5e7eb;
      --gray-400:#9ca3af;
      --gray-600:#4b5563;
      --danger:  #dc2626;
      --focus:   rgba(10,10,10,0.15);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
    }

    /* ── Panel izquierdo (negro / marca) ── */
    .brand-panel {
      flex: 1;
      background: var(--black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Círculo decorativo de fondo */
    .brand-panel::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.05);
      top: -120px; left: -120px;
    }
    .brand-panel::after {
      content: '';
      position: absolute;
      width: 350px; height: 350px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.05);
      bottom: -80px; right: -80px;
    }

    .brand-logo {
      width: 320px;
      height: auto;
      position: relative;
      z-index: 1;
    }

    .brand-title {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.03em;
      position: relative;
      z-index: 1;
    }

    .brand-subtitle {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.45);
      margin-top: 0.5rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    .brand-divider {
      width: 40px;
      height: 3px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      margin: 1.25rem auto;
      position: relative;
      z-index: 1;
    }

    .brand-tagline {
      font-size: 0.875rem;
      color: rgba(255,255,255,0.35);
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }

    /* ── Panel derecho (formulario) ── */
    .form-panel {
      width: 420px;
      min-width: 420px;
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2.5rem;
    }

    .form-inner { width: 100%; }

    .form-header { margin-bottom: 2rem; }
    .form-header h2 {
      font-size: 1.625rem;
      font-weight: 700;
      color: var(--black);
      letter-spacing: -0.02em;
    }
    .form-header p {
      font-size: 0.875rem;
      color: var(--gray-400);
      margin-top: 0.375rem;
    }

    .form-group { margin-bottom: 1.125rem; }
    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--gray-600);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .input-wrapper { position: relative; }
    .input-wrapper > i {
      position: absolute; left: 0.875rem; top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400); font-size: 0.875rem; pointer-events: none;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 2.75rem 0.75rem 2.5rem;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      font-family: inherit; font-size: 0.9375rem;
      color: var(--black);
      background: var(--gray-50);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .form-group input:focus {
      border-color: var(--black);
      background: var(--white);
      box-shadow: 0 0 0 3px var(--focus);
    }
    .form-group input::placeholder { color: var(--gray-400); }
    .toggle-password {
      position: absolute; right: 0.75rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--gray-400); font-size: 1rem; padding: 0.25rem;
      display: flex; align-items: center; line-height: 1;
      transition: color 0.15s;
    }
    .toggle-password:hover { color: var(--black); }

    .btn-login {
      width: 100%; padding: 0.8125rem;
      background: var(--black); color: var(--white);
      border: none; border-radius: 8px;
      font-family: inherit; font-size: 0.9375rem; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: background 0.15s, transform 0.1s;
      margin-top: 1.5rem;
      letter-spacing: 0.01em;
    }
    .btn-login:hover:not(:disabled) { background: var(--black-2); transform: translateY(-1px); }
    .btn-login:active:not(:disabled) { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    .error-msg {
      display: none; align-items: center; gap: 0.5rem;
      background: #fef2f2; border: 1px solid #fecaca; color: var(--danger);
      border-radius: 8px; padding: 0.625rem 0.875rem;
      font-size: 0.875rem; margin-top: 1rem;
    }
    .error-msg.visible { display: flex; }

    .form-footer {
      text-align: center; margin-top: 2.5rem;
      font-size: 0.8125rem; color: var(--gray-400);
    }

    /* ── Responsive: una columna en móvil ── */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .brand-panel {
        padding: 2.5rem 1.5rem;
        flex: none;
      }
      .brand-logo { width: 220px; margin-bottom: 1.25rem; }
      .brand-title { font-size: 1.75rem; }
      .brand-tagline { display: none; }
      .form-panel { width: 100%; min-width: unset; padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Panel izquierdo: marca -->
  <div class="brand-panel">
    <img src="img/panda-tec-black-1.svg" alt="Panta Tec" class="brand-logo" />
    <div class="brand-divider"></div>
    <p class="brand-tagline" id="storeName">Control total de tu negocio de celulares</p>
  </div>

  <!-- Panel derecho: formulario -->
  <div class="form-panel">
    <div class="form-inner">
      <div class="form-header">
        <h2>Bienvenido</h2>
        <p>Ingresa tus credenciales para continuar</p>
      </div>

      <form id="loginForm" method="post" novalidate>
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <div class="input-wrapper">
            <i class="fas fa-user" aria-hidden="true"></i>
            <input type="text" id="usuario" name="usuario" placeholder="Tu nombre de usuario"
              autocomplete="username" required aria-required="true" aria-describedby="errorMsg" />
          </div>
        </div>

        <div class="form-group">
          <label for="clave">Contraseña</label>
          <div class="input-wrapper">
            <i class="fas fa-lock" aria-hidden="true"></i>
            <input type="password" id="clave" name="clave" placeholder="Tu contraseña"
              autocomplete="current-password" required aria-required="true" aria-describedby="errorMsg" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text"><i class="fas fa-arrow-right-to-bracket" aria-hidden="true"></i> Iniciar sesión</span>
          <span class="spinner" role="status" aria-label="Procesando..."></span>
        </button>

        <div class="error-msg" id="errorMsg" role="alert" aria-live="assertive">
          <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
          <span id="errorText">Credenciales incorrectas. Intenta de nuevo.</span>
        </div>

        <div style="text-align:center;margin-top:1rem;">
          <a href="/recuperar.html" style="color:var(--gray-400);font-size:0.8125rem;text-decoration:none;transition:color 0.15s;" onmouseover="this.style.color='var(--black)'" onmouseout="this.style.color='var(--gray-400)'">
            <i class="fas fa-key" style="margin-right:0.25rem;"></i>¿Olvidaste tu contraseña?
          </a>
        </div>
      </form>

      <!-- Separador -->
      <div style="display:flex;align-items:center;gap:0.75rem;margin-top:1.5rem;">
        <div style="flex:1;height:1px;background:var(--gray-200);"></div>
        <span style="font-size:0.75rem;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.08em;">o continuar con</span>
        <div style="flex:1;height:1px;background:var(--gray-200);"></div>
      </div>

      <!-- Google Sign-In -->
      <button type="button" id="btnGoogle" style="width:100%;padding:0.75rem;background:var(--white);color:var(--black);border:1.5px solid var(--gray-200);border-radius:8px;font-family:inherit;font-size:0.9375rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.625rem;margin-top:1rem;transition:background 0.15s,border-color 0.15s;" onmouseover="this.style.borderColor='var(--black)';this.style.background='var(--gray-50)'" onmouseout="this.style.borderColor='var(--gray-200)';this.style.background='var(--white)'">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.08 24.08 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Iniciar con Google
      </button>

      <div class="form-footer">
        <p>© <span id="year"></span> Panta Tec</p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
      const input = document.getElementById('clave');
      const icon  = document.getElementById('eyeIcon');
      const show  = input.type === 'password';
      input.type     = show ? 'text' : 'password';
      icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
      this.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
  </script>

  <script type="module">
    import { login, isLoggedIn } from './js/auth.js';

    if (isLoggedIn()) window.location.href = '/dashboard.html';

    document.getElementById('year').textContent = new Date().getFullYear();

    (async () => {
      try {
        const base = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
          ? 'http://localhost:3000/api' : `${window.location.origin}/api`;
        const res = await fetch(`${base}/configuracion/publica`);
        if (res.ok) {
          const data = await res.json();
          if (data.nombre_tienda) {
            document.getElementById('storeName').textContent = data.nombre_tienda;
            document.title = `${data.nombre_tienda} — Iniciar sesión`;
          }
        }
      } catch { /* silencioso */ }
    })();

    const form    = document.getElementById('loginForm');
    const btn     = document.getElementById('loginBtn');
    const errorEl = document.getElementById('errorMsg');
    const errorTx = document.getElementById('errorText');

    const setLoading = (v) => { btn.disabled = v; btn.classList.toggle('loading', v); };
    const showError  = (msg) => { errorTx.textContent = msg; errorEl.classList.add('visible'); };
    const hideError  = () => errorEl.classList.remove('visible');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const usuario = document.getElementById('usuario').value.trim();
      const clave   = document.getElementById('clave').value;
      if (!usuario || !clave) { showError('Por favor completa todos los campos.'); return; }
      setLoading(true);
      const { ok, data } = await login(usuario, clave);
      setLoading(false);
      if (ok) {
        window.location.href = '/dashboard.html';
      } else {
        showError(data?.error || 'Credenciales incorrectas. Intenta de nuevo.');
        document.getElementById('clave').value = '';
        document.getElementById('clave').focus();
      }
    });

    // Google Sign-In
    document.getElementById('btnGoogle').addEventListener('click', async () => {
      try {
        // Load Google Identity Services library dynamically
        if (!window.google?.accounts) {
          await new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'https://accounts.google.com/gsi/client';
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
          });
        }

        // Fetch Google Client ID from server config
        const configRes = await fetch(
          (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:3000/api/configuracion/publica'
            : `${window.location.origin}/api/configuracion/publica`
        );
        const configData = configRes.ok ? await configRes.json() : {};
        const googleClientId = configData.google_client_id || '';

        if (!googleClientId) {
          showError('Google Sign-In no está configurado. Contacta al administrador.');
          return;
        }

        google.accounts.id.initialize({
          client_id: googleClientId,
          callback: async (response) => {
            setLoading(true);
            const res = await (await import('./js/api.js')).api.post('/auth/google', { credential: response.credential });
            setLoading(false);
            if (res.ok && res.data.token) {
              localStorage.setItem('panta_token', res.data.token);
              const user = res.data.usuario || null;
              if (user) localStorage.setItem('panta_user', JSON.stringify(user));
              window.location.href = '/dashboard.html';
            } else {
              showError(res.data?.error || 'Error al iniciar sesión con Google');
            }
          },
        });

        google.accounts.id.prompt();
      } catch (err) {
        console.error('Error Google Sign-In:', err);
        showError('No se pudo conectar con Google. Intenta de nuevo.');
      }
    });
  </script>
</body>
</html>
