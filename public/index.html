<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panta Tec — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --color-primary: #2563EB;
      --color-primary-dark: #1D4ED8;
      --color-primary-light: #DBEAFE;
      --color-danger: #DC2626;
      --color-bg: #F8FAFC;
      --color-surface: #FFFFFF;
      --color-border: #E2E8F0;
      --color-text: #1E293B;
      --color-text-muted: #64748B;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }
    .brand { text-align: center; margin-bottom: 0.5rem; }
    .brand-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px;
      background: var(--color-primary-light); border-radius: 14px; margin-bottom: 0.75rem;
    }
    .brand-icon i { font-size: 1.75rem; color: var(--color-primary); }
    .brand-name { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand-store { font-size: 0.875rem; color: var(--color-text-muted); margin-top: 0.25rem; min-height: 1.25rem; }
    hr { border: none; border-top: 1px solid var(--color-border); margin: 1.5rem 0; }
    .form-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 1.25rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 0.875rem; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); font-size: 0.875rem; pointer-events: none; }
    .form-group input {
      width: 100%; padding: 0.625rem 0.875rem 0.625rem 2.5rem;
      border: 1px solid var(--color-border); border-radius: 8px;
      font-family: inherit; font-size: 1rem; color: var(--color-text);
      background: var(--color-surface); outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .form-group input::placeholder { color: var(--color-text-muted); }
    .btn-login {
      width: 100%; padding: 0.75rem; background: var(--color-primary); color: #fff;
      border: none; border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: background 0.15s; margin-top: 1.25rem;
    }
    .btn-login:hover:not(:disabled) { background: var(--color-primary-dark); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }
    .error-msg {
      display: none; align-items: center; gap: 0.5rem;
      background: #FEF2F2; border: 1px solid #FECACA; color: var(--color-danger);
      border-radius: 8px; padding: 0.625rem 0.875rem; font-size: 0.875rem; margin-top: 1rem;
    }
    .error-msg.visible { display: flex; }
    .login-footer { text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--color-text-muted); }
    @media (max-width: 440px) { .login-card { padding: 2rem 1.25rem; } }
  </style>
</head>
<body>
  <div class="login-card" role="main">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true"><i class="fas fa-mobile-alt"></i></div>
      <h1 class="brand-name">Panta Tec</h1>
      <p class="brand-store" id="storeName">Sistema de Gestión</p>
    </div>
    <hr />
    <form id="loginForm" novalidate>
      <h2 class="form-title">Iniciar sesión</h2>
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <div class="input-wrapper">
          <i class="fas fa-user" aria-hidden="true"></i>
          <input type="text" id="usuario" name="usuario" placeholder="Tu nombre de usuario"
            autocomplete="username" required aria-required="true" aria-describedby="errorMsg" />
        </div>
      </div>
      <div class="form-group">
        <label for="clave">Contraseña</label>
        <div class="input-wrapper">
          <i class="fas fa-lock" aria-hidden="true"></i>
          <input type="password" id="clave" name="clave" placeholder="Tu contraseña"
            autocomplete="current-password" required aria-required="true" aria-describedby="errorMsg" />
        </div>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text"><i class="fas fa-sign-in-alt" aria-hidden="true"></i> Iniciar sesión</span>
        <span class="spinner" role="status" aria-label="Procesando..."></span>
      </button>
      <div class="error-msg" id="errorMsg" role="alert" aria-live="assertive">
        <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
        <span id="errorText">Credenciales incorrectas. Intenta de nuevo.</span>
      </div>
    </form>
    <div class="login-footer"><p>© <span id="year"></span> Panta Tec</p></div>
  </div>

  <script type="module">
    import { login, isLoggedIn } from './js/auth.js';

    if (isLoggedIn()) window.location.href = '/dashboard.html';

    document.getElementById('year').textContent = new Date().getFullYear();

    // Cargar nombre de tienda
    (async () => {
      try {
        const base = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
          ? 'http://localhost:3000/api' : `${window.location.origin}/api`;
        const res = await fetch(`${base}/configuracion/publica`);
        if (res.ok) {
          const data = await res.json();
          if (data.nombre_tienda) {
            document.getElementById('storeName').textContent = data.nombre_tienda;
            document.title = `${data.nombre_tienda} — Iniciar sesión`;
          }
        }
      } catch { /* silencioso */ }
    })();

    const form    = document.getElementById('loginForm');
    const btn     = document.getElementById('loginBtn');
    const errorEl = document.getElementById('errorMsg');
    const errorTx = document.getElementById('errorText');

    const setLoading = (v) => { btn.disabled = v; btn.classList.toggle('loading', v); };
    const showError  = (msg) => { errorTx.textContent = msg; errorEl.classList.add('visible'); };
    const hideError  = () => errorEl.classList.remove('visible');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const usuario = document.getElementById('usuario').value.trim();
      const clave   = document.getElementById('clave').value;
      if (!usuario || !clave) { showError('Por favor completa todos los campos.'); return; }
      setLoading(true);
      const { ok, data } = await login(usuario, clave);
      setLoading(false);
      if (ok) {
        window.location.href = '/dashboard.html';
      } else {
        showError(data?.error || 'Credenciales incorrectas. Intenta de nuevo.');
        document.getElementById('clave').value = '';
        document.getElementById('clave').focus();
      }
    });
  </script>
</body>
</html>
