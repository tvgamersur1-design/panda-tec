<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000012"/>
    </filter>
  </defs>

  <!-- Fondo header negro -->
  <rect width="900" height="64" fill="#0a0a0a"/>
  <!-- Borde inferior sutil -->
  <line x1="0" y1="63.5" x2="900" y2="63.5" stroke="#ffffff18" stroke-width="1"/>

  <!-- Título de página -->
  <text x="24" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="-0.4">Productos</text>

  <!-- ── Lado derecho ── -->

  <!-- Chip fecha -->
  <rect x="530" y="18" width="190" height="28" rx="8" fill="#1a1a1a" stroke="#ffffff18" stroke-width="1"/>
  <!-- Icono calendario -->
  <text x="545" y="36" font-family="sans-serif" font-size="13" fill="#94a3b8">📅</text>
  <text x="566" y="36" font-family="Inter, sans-serif" font-size="11.5" fill="#94a3b8">Mié, 6 de mayo 2026</text>

  <!-- Separador vertical -->
  <line x1="740" y1="18" x2="740" y2="46" stroke="#ffffff18" stroke-width="1"/>

  <!-- Avatar usuario -->
  <circle cx="762" cy="32" r="16" fill="#ffffff"/>
  <text x="762" y="37" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0a0a0a" text-anchor="middle">A</text>

  <!-- Nombre + rol -->
  <text x="784" y="27" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Administrador</text>
  <text x="784" y="42" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">Admin</text>

  <!-- Chevron -->
  <text x="868" y="36" font-family="sans-serif" font-size="11" fill="#64748b">▾</text>
</svg>
